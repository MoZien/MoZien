<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0f11" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Gebrauchtwagen vor dem Kauf prüfen: Marktwert aus vergleichbaren Angeboten, Risiken aus Text und Fotos und eine klare Empfehlung." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AutoHalle – Gebrauchtwagen prüfen" />
    <meta property="og:description" content="Link einer Anzeige einfügen und sehen, ob der Preis stimmt – mit Marktwert, Risiken und Empfehlung." />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="apple-mobile-web-app-title" content="AutoHalle" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>AutoHalle</title>
    <script>
      // Apply the saved theme and language before the first paint (no flash).
      try {
        var ui = JSON.parse(localStorage.getItem("ah.ui") || "{}");
        var prefs = JSON.parse(localStorage.getItem("ah.prefs") || "{}");
        var dark = ui.theme === "dark" || (ui.theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        var lang = prefs.language || "ar";
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
      } catch (e) {}
    </script>
    <style>
      /* Start screen: shown until the app's code has loaded, removed by main.tsx. */
      #splash { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #f5f5f2; color: #16181b;
        font-family: "IBM Plex Sans", "IBM Plex Sans Arabic", system-ui, sans-serif; transition: opacity 0.3s ease; }
      .dark #splash { background: #0e0f11; color: #f2f2ef; }
      #splash.out { opacity: 0; pointer-events: none; }
      #splash .brand { display: flex; align-items: center; gap: 12px; direction: ltr; animation: sp-in 0.35s ease-out both; }
      #splash svg { width: 40px; height: 40px; }
      #splash .name { font-size: 26px; letter-spacing: -0.02em; }
      #splash .name b { font-weight: 600; }
      #splash .name span { font-weight: 400; }
      @keyframes sp-in { from { opacity: 0; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #splash * { animation: none !important; } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="brand">
        <svg viewBox="0 0 64 64" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 44 L32 15 L50 44" stroke="currentColor" stroke-width="7.5" />
          <path d="M14 53 H50" stroke="#1f4bd8" stroke-width="6.5" />
        </svg>
        <div class="name"><b>Auto</b><span>Halle</span></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
