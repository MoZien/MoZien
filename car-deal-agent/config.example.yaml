# Copy to config.yaml and adjust. Prices in EUR.

language: ar              # language of the AI review and Telegram messages: ar | de | en
watch_market: false       # false: only analyse links sent in Telegram; true: also search on its own
interval_minutes: 15      # with watch_market: true, search every ~15 minutes (randomised ±15 %)
database: data/cardeal.sqlite3

# One entry per search. Without make/model (like the first one) every new ad is
# opened to read its make and model, and valued against ads of exactly that model.
# make/model are Kleinanzeigen's URL slugs: pick brand and model in the filters on
# kleinanzeigen.de and copy them from the URL (...+autos.marke_s:opel+autos.model_s:corsa).
searches:
  - name: Alle Autos bis 3.000 € um Halle
    max_price: 3000       # your budget
    min_price: 500        # filters out "1 €", swap and spam ads
    min_year: 2002
    max_km: 200000
    seller: privat        # privat | gewerblich, leave out for both
    zip_code: "06108"     # Halle (Saale)
    radius_km: 200
    pages: 2              # ~25 ads per page, newest first (~1 new ad per minute here)

  # Example of a model search (comparables come straight from the search):
  # - name: VW Golf up to 9,000 €
  #   make: volkswagen
  #   model: golf
  #   max_price: 9000
  #   min_year: 2013
  #   max_km: 160000
  #   gearbox: manuell    # manuell | automatik
  #   pages: 3

valuation:
  lookback_days: 60          # how long seen ads count as market data
  min_comparables: 5
  year_window: 2             # comparables within ±2 years ...
  km_window: 0.4             # ... and ±40 % mileage (at least ±20,000 km)
  price_ceiling_factor: 1.6  # model searches also collect ads up to 1.6× budget as market data
  comparables_refresh_hours: 24  # broad searches: fetch comparables per model/year at most daily
  comparables_pages: 2

deal:
  min_discount: 0.12         # at least 12 % below market before we look closer
  min_profit: 500            # € after all costs (cars up to 3,000 € have smaller margins)
  min_roi: 0.15
  negotiation_discount: 0.05 # expected haggling on "VB" ads
  resale_factor: 0.95        # you resell at ~95 % of the market asking price
  fixed_costs:               # per car
    registration: 120        # short-term plates / registration
    transport: 100
    cleaning: 150
  hu_cost: 200               # added when the HU (TÜV) is due within hu_warning_months
  hu_warning_months: 6
  vat_margin_scheme: false   # true once you trade as a business (§25a UStG)
  suspicious_discount: 0.40  # this far below market = "check", never "deal"
  notify_on: [deal, check]
  alert_existing: false      # first run only collects market data; true = also rate ads already online

ai:
  enabled: true
  model: claude-opus-5-5
  effort: medium             # low | medium | high
  max_tokens: 16000

scraper:
  min_delay_seconds: 4       # pause between requests; keep it slow
  max_delay_seconds: 9
  max_details_per_run: 30    # broad searches: ads opened per run at most

filters:
  # Titles containing these words are skipped (dealer "we buy your car" ads etc.)
  exclude_keywords: [ankauf, wir kaufen, kaufe dein, suche, gesuch, tausche]
