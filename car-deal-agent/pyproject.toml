[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "car-deal-agent"
version = "1.4.0"
description = "Watches Kleinanzeigen for used cars priced below market value and judges whether they are worth flipping."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.15",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=8", "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]

[project.scripts]
cardeal = "cardeal.cli:main"
cardeal-web = "cardeal.web.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cardeal = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
