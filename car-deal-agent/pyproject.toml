[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "car-deal-agent"
version = "0.1.0"
description = "Watches Kleinanzeigen for used cars priced below market value and judges whether they are worth flipping."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.15",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cardeal = "cardeal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
