# Render Blueprint for the AutoHalle web app (car-deal-agent/). One instance: jobs and the
# comparables cache live in that process. Free plan: the instance sleeps after 15 idle minutes;
# the app still opens at once from the phone (service worker) and waits for the server in the
# background. "Starter" keeps it awake all the time and allows sending mail through Gmail.
services:
  - type: web
    name: autohalle
    runtime: docker
    plan: free
    region: frankfurt
    branch: claude/intelligent-fermi-lme4t3
    dockerfilePath: ./car-deal-agent/Dockerfile
    dockerContext: ./car-deal-agent
    numInstances: 1
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - car-deal-agent/**
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY   # your Claude API key (asked for when the Blueprint is created)
        sync: false
      # Sign-in with a code by email, sent free from your Gmail by a Google Apps Script
      # (car-deal-agent/deploy/gmail-sender.gs). Alternatives: Brevo (BREVO_API_KEY + MAIL_FROM)
      # or a Gmail app password over SMTP (GMAIL_USER + GMAIL_APP_PASSWORD, paid plans only).
      - key: GMAIL_SCRIPT_URL    # the script's web app address (…/exec)
        sync: false
      - key: GMAIL_SCRIPT_SECRET # the same secret word as in the script
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM           # e.g. AutoHalle <your.name@gmail.com>
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: ADMIN_EMAILS        # your own address: no daily limit, AI check in the settings
        sync: false
      # Impressum and privacy policy: who runs the app (address lines separated by ";")
      - key: LEGAL_NAME
        sync: false
      - key: LEGAL_ADDRESS
        sync: false
      - key: LEGAL_EMAIL
        sync: false
      - key: LEGAL_PHONE
        sync: false
      - key: ALLOWED_EMAILS      # empty = anyone may sign up; or name@x.de,@company.de
        sync: false
      - key: ACCESS_CODES        # optional second way in: name:code,name:code ...
        sync: false
      - key: ADMIN_CODE          # your own code: no daily limit
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: AI_MODEL
        value: claude-sonnet-5-5
      - key: APP_NAME
        value: AutoHalle
      - key: AI_DAILY_LIMIT
        value: "40"
      - key: AI_GLOBAL_LIMIT     # AI reviews per day for all users together
        value: "400"
      - key: JOB_WORKERS         # analyses at the same time
        value: "2"
